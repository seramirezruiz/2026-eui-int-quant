blocks:
  1:
    title: "Inference, hypothesis testing, and the practice of quantitative research"
    by: "KM"
    intro: "Before any model, method, or dataset: what are we doing when we do quantitative social science? This block sets the epistemic foundations of the course: the logic of inference and its well-documented pathologies, the practices that make research credible and reproducible, and the crucial habit of asking what a given analysis is for."
  2:
    title: "Causal thinking and measurement"
    by: "SRR"
    intro: "Two questions come before any estimation: what exactly is the quantity we are trying to estimate, and do our numbers actually measure the concepts we care about?"
  3:
    title: "Modeling"
    by: "KM & SRR"
    intro: "With estimands and measures in hand, we turn to the model families that do most of the work in applied political science and sociology. Each week pairs the mechanics of estimation with the question of interpretation: what does this model let us say, and what does it not?"
  4:
    title: "Advanced tools for quantitative and computational analysis"
    by: "KM & SRR"
    intro: ""

